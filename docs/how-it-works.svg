<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc" id="how-it-works-root">
        <title id="how-it-works-title">One call to pr_readiness, end to end</title>
        <desc id="how-it-works-desc">Sequence diagram: a coding agent asks pr_readiness about one pull request, the tool makes one read-only GraphQL query to GitHub, applies the readiness rule to the snapshot, and answers with a verdict, reasons that each name an owner, the head commit and the time it was checked.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #how-it-works-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #how-it-works-root { font-family: var(--font-sans); color: var(--color-ink); }
      #how-it-works-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#how-it-works-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="how-it-works-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="how-it-works-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="how-it-works-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: Agent 160, Tool 480, GitHub 800 -->
        <line x1="160" y1="120" x2="160" y2="440" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="480" y1="120" x2="480" y2="440" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="800" y1="120" x2="800" y2="440" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>

        <!-- Activation bars -->
        <rect x="476" y="164" width="8" height="244" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="220" width="8" height="64" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Callout leaders (dashed, drawn with the arrows) -->
        <path d="M 264 48 Q 264 104 264 164" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="264" cy="168" r="2" fill="#2d3142"/>
        <path d="M 240 460 Q 240 432 240 404" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="240" cy="400" r="2" fill="#2d3142"/>

        <!-- M1: Agent → tool call -->
        <line x1="160" y1="168" x2="476" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#how-it-works-arrow)"/>
        <!-- M2: tool → GitHub, one fixed GraphQL query -->
        <line x1="484" y1="224" x2="796" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#how-it-works-arrow-link)"/>
        <!-- M3: GitHub → tool, the PR snapshot (return) -->
        <line x1="796" y1="280" x2="484" y2="280" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#how-it-works-arrow)"/>
        <!-- M4: tool applies the rule to the snapshot (self message) -->
        <path d="M 484 320 L 520 320 L 520 352 L 484 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#how-it-works-arrow)"/>
        <!-- M5: tool → Agent, the verdict (headline) -->
        <line x1="476" y1="400" x2="160" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#how-it-works-arrow-accent)"/>

        <!-- Message labels -->
        <rect x="282" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="318" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PR_READINESS</text>

        <rect x="600" y="204" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="213" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRAPHQL QUERY</text>

        <rect x="604" y="260" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PR SNAPSHOT</text>

        <rect x="532" y="330" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="574" y="339" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY THE RULE</text>

        <rect x="290" y="380" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="318" y="389" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERDICT</text>

        <!-- Callouts (italic serif asides) -->
        <text x="72" y="40" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">one PR, plus the commit it expects to be the head after a push</text>
        <text x="72" y="472" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">answer: verdict · reasons, each with code, owner and fix · head_sha · checked_at</text>

        <!-- Actor: Coding agent (input) -->
        <rect x="72" y="64" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="64" width="176" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="80" y="72" width="36" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="98" y="81" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="160" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coding agent</text>
        <text x="160" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Code · Cursor · Codex</text>

        <!-- Actor: pr-ready-mcp (focal) -->
        <rect x="392" y="64" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="64" width="176" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="400" y="72" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="416" y="81" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="480" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pr-ready-mcp</text>
        <text x="480" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pr_readiness · read-only</text>

        <!-- Actor: GitHub (external) -->
        <rect x="712" y="64" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="64" width="176" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="720" y="72" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="734" y="81" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="800" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub</text>
        <text x="800" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GraphQL · one fresh read</text>

        <!-- Legend -->
        <line x1="72" y1="504" x2="888" y2="504" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="72" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="72" y="540" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="92" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The tool</text>

        <rect x="184" y="536" width="4" height="18" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <text x="196" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Working</text>

        <line x1="292" y1="546" x2="320" y2="546" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#how-it-works-arrow-link)"/>
        <text x="328" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <line x1="436" y1="546" x2="464" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#how-it-works-arrow)"/>
        <text x="472" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Response</text>

        <line x1="568" y1="546" x2="596" y2="546" stroke="#bf4520" stroke-width="1.4" marker-end="url(#how-it-works-arrow-accent)"/>
        <text x="604" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The answer</text>
      </svg>
