<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verdict-title verdict-desc" id="verdict-root">
        <title id="verdict-title">How the verdict is decided</title>
        <desc id="verdict-desc">Flowchart: a wrong head commit is reported as stale_head and the verdict is not_ready even for a merged or closed PR; a merged or closed PR with the right head is reported, not judged; an open PR collects every applicable reason about merge state, checks on the head commit, review and merge queue, each with an owner, and the verdict is ready only when no reason is listed.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #verdict-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #verdict-root { font-family: var(--font-sans); color: var(--color-ink); }
      #verdict-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#verdict-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="verdict-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="verdict-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start → Head diamond -->
        <line x1="400" y1="80" x2="400" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Head diamond NO → Wrong head -->
        <line x1="528" y1="152" x2="680" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Head diamond YES → Open diamond -->
        <line x1="400" y1="200" x2="400" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Open diamond NO → Merged or closed -->
        <line x1="272" y1="272" x2="224" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Open diamond YES → Collect -->
        <line x1="400" y1="320" x2="400" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Collect → Any reason diamond -->
        <line x1="400" y1="504" x2="400" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Any reason YES → not_ready -->
        <line x1="528" y1="576" x2="680" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <!-- Any reason NO → ready (accent: the verified path) -->
        <line x1="400" y1="624" x2="400" y2="648" stroke="#bf4520" stroke-width="1.4" marker-end="url(#verdict-arrow-accent)"/>
        <!-- Wrong head → not_ready, around the right margin -->
        <path d="M 840 152 L 880 152 Q 888 152 888 160 L 888 568 Q 888 576 880 576 L 840 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>

        <!-- Callout leader -->
        <path d="M 896 116 Q 904 180 890 236" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="888" cy="240" r="2" fill="#2d3142"/>

        <!-- Arrow labels -->
        <rect x="592" y="132" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="408" y="206" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="424" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="236" y="252" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="408" y="326" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="424" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="588" y="556" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="565" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="408" y="630" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="639" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Callout -->
        <text x="888" y="108" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">a wrong head wins over merged / closed</text>

        <!-- Start oval -->
        <rect x="304" y="24" width="192" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="400" y="50" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PR snapshot from GitHub</text>
        <text x="400" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one read-only query</text>

        <!-- Diamond: head matches the expected sha? -->
        <polygon points="400,104 528,152 400,200 272,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Head = expected sha?</text>
        <text x="400" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skipped when no sha is given</text>

        <!-- Rectangle: wrong head -->
        <rect x="680" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="149" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wrong head</text>
        <text x="760" y="165" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stale_head · author</text>

        <!-- Diamond: PR still open? -->
        <polygon points="400,224 528,272 400,320 272,272" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PR still open?</text>
        <text x="400" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state = OPEN</text>

        <!-- End oval: merged or closed -->
        <rect x="64" y="248" width="160" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="144" y="269" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merged or closed</text>
        <text x="144" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reported, not judged</text>

        <!-- Rectangle: collect every reason -->
        <rect x="80" y="344" width="760" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="88" y="352" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="104" y="361" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.8">STEP</text>
        <text x="132" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Collect every reason that applies</text>
        <text x="132" y="377" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">nothing short-circuits · each reason carries code · owner · detail · fix</text>

        <text x="96" y="404" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MERGE STATE · GITHUB'S OWN AGGREGATE</text>
        <text x="96" y="422" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">draft <tspan fill="#4f5d75">· author</tspan></text>
        <text x="96" y="436" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">conflicts <tspan fill="#4f5d75">· author</tspan></text>
        <text x="96" y="450" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">behind_base <tspan fill="#4f5d75">· author</tspan></text>
        <text x="96" y="464" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">mergeable_unknown <tspan fill="#4f5d75">· wait</tspan></text>
        <text x="96" y="478" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">unsupported_merge_state <tspan fill="#4f5d75">· unknown</tspan></text>
        <text x="96" y="492" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">blocked_by_branch_rule <tspan fill="#4f5d75">· unknown</tspan></text>

        <text x="352" y="404" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHECKS ON THE HEAD COMMIT</text>
        <text x="352" y="422" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">checks_missing <tspan fill="#4f5d75">· wait</tspan></text>
        <text x="352" y="436" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">stale_head <tspan fill="#4f5d75">· wait</tspan></text>
        <text x="352" y="450" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">checks_failing <tspan fill="#4f5d75">· author</tspan></text>
        <text x="352" y="464" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">checks_pending <tspan fill="#4f5d75">· wait</tspan></text>

        <text x="608" y="404" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">REVIEW AND MERGE QUEUE</text>
        <text x="608" y="422" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">review_required <tspan fill="#4f5d75">· reviewer</tspan></text>
        <text x="608" y="436" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">changes_requested <tspan fill="#4f5d75">· author</tspan></text>
        <text x="608" y="450" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">merge_queue <tspan fill="#4f5d75">· wait</tspan></text>

        <!-- Diamond: any reason? -->
        <polygon points="400,528 528,576 400,624 272,576" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="574" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any reason listed?</text>
        <text x="400" y="590" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reasons[] not empty</text>

        <!-- End oval: not_ready -->
        <rect x="680" y="552" width="160" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="760" y="573" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">not_ready</text>
        <text x="760" y="589" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not verified ready</text>

        <!-- End oval: ready (focal) -->
        <rect x="320" y="648" width="160" height="56" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="400" y="674" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ready</text>
        <text x="400" y="690" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">head_sha · checked_at</text>

        <!-- Legend -->
        <line x1="72" y1="728" x2="888" y2="728" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="72" y="744" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="72" y="760" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="104" y="770" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / verdict (oval)</text>

        <rect x="252" y="760" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="770" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="420,766 432,760 444,766 432,772" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="456" y="770" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="600" y1="768" x2="628" y2="768" stroke="#bf4520" stroke-width="1.4" marker-end="url(#verdict-arrow-accent)"/>
        <text x="636" y="770" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Verified ready</text>

        <line x1="740" y1="768" x2="768" y2="768" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#verdict-arrow)"/>
        <text x="776" y="770" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
      </svg>
