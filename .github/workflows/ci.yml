name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci # also builds dist/ through the prepare script
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Tool reference is up to date
        run: npm run docs && git diff --exit-code docs/
